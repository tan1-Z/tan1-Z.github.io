name: CMTXS rules and multiplayer
on:
  push:
    branches: [main]
    paths: ['source/cmtxs/**', 'services/cmtxs/**', '.github/workflows/cmtxs-checks.yml']
  pull_request:
    paths: ['source/cmtxs/**', 'services/cmtxs/**', '.github/workflows/cmtxs-checks.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/cmtxs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/cmtxs/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
